];

function slugNovo(){const a='abcdefghijkmnpqrstuvwxyz23456789';let s='';const r=crypto.getRandomValues(new Uint8Array(10));r.forEach(x=>s+=a[x%a.length]);return s}
function linkB(slug){return SITE+'#r='+slug}

function lsGet(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(_){return null}}
function lsSet(k,v){try{v===null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v))}catch(_){}}
function salvar(slug,papel,nomes){try{const k='sintonia_meus';const m=meus();m[slug]={p:papel,n:nomes||''};localStorage.setItem(k,JSON.stringify(m))}catch(_){}}

function retomar(){
  const m=meus(),ks=Object.keys(m).slice(-3).reverse(),dr=lsGet('sintonia_rasc_novo');

  return `<div class="card"><b>Seus testes neste celular</b>${dr?`<a class="btn sec" href="#" id="rasc">Continuar respondendo (${dr.i}/20)</a>`:''}${ks.map(k=>`<a class="btn sec" href="#${(m[k].p||m[k])==='a'?'c':'r'}=${k}">${esc(m[k].n||'Ver teste')} →</a>`).join('')}</div>`;
}

function quiz(nomeA,nomeB,papel,slug){
  $('#foot').classList.add('hide');
  const RK='sintonia_rasc_'+(slug||'novo');
  const dr=lsGet(RK);const resp=(dr&&dr.resp)||new Array(20).fill(null);let i=(dr&&dr.i)||0;
  const guarda=()=>lsSet(RK,{a:nomeA,b:nomeB,resp,i});
  const eu=papel==='a'?nomeA:nomeB;
  function draw(){
    const q=Q[i];
    $('#app').innerHTML=`<div class="card">
      <div class="mut" style="display:flex;justify-content:space-between"><span>${esc(eu)}, responda sobre você</span><span>${i+1}/20</span></div>
      <div class="bar" style="margin:8px 0 14px"><i style="width:${i/20*100}%"></i></div>
      <span class="tag">${AREAS[Math.floor(i/4)]}</span>
      <h2 style="margin-top:.5em">${q[0]}</h2>
      ${q[1].map((o,k)=>`<button class="opt ${resp[i]===k?'sel':''}" aria-pressed="${resp[i]===k}" data-k="${k}">${o}</button>`).join('')}
      ${i>0?'<button class="btn sec" id="back" style="margin-top:6px">← Voltar</button>':''}
    </div>`;
    document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{resp[i]=+b.dataset.k;if(i<19){i++;guarda();draw()}else{guarda();fim()}});
    if(i>0)$('#back').onclick=()=>{i--;draw()};
  }
  async function fim(){
    $('#app').innerHTML='<div class="card center"><p>Salvando suas respostas…</p></div>';
    try{
      if(papel==='a'){
        let ok=false,s;for(let t=0;t<3&&!ok;t++){s=slugNovo();ok=await rpc('quiz_criar',{p_slug:s,p_nome_a:nomeA,p_nome_b:nomeB,p_resp:resp})}
        if(!ok)throw new Error('criar');
        lsSet(RK,null);salvar(s,'a',nomeA+' ♥ '+nomeB);track('quiz_criado',s);history.replaceState(null,'','#c='+s);convite(s,nomeA,nomeB,true);
      }else{
        const ok=await rpc('quiz_responder',{p_slug:slug,p_resp:resp});
        lsSet(RK,null);salvar(slug,'b',nomeA+' ♥ '+nomeB);track('b_respondeu',slug);abrir(slug);
        if(!ok)toast('Esse teste já tinha sido respondido');
      }
    }catch(e){$('#app').innerHTML=`<div class="card center"><p>Não consegui salvar (internet?).</p><button class="btn" id="rt">Tentar de novo</button></div>`;$('#rt').onclick=fim}
  }
  draw();
}

    <h1>Agora é a vez de ${esc(nomeB)}</h1>
    <p>Mande o link pro seu par. Assim que ${esc(nomeB)} responder, o resultado aparece <b>pra vocês dois</b>.</p>
    <a class="btn wa" id="wa" href="${wa(txt)}" target="_blank" rel="noopener">Enviar no WhatsApp</a>
    <button class="btn sec" id="cp">Copiar link do par</button>
    <p class="mut" style="margin-top:16px">Guarde o <b>seu</b> link pra ver o resultado depois (também fica salvo neste celular):<br><a href="${linkA(slug)}">${linkA(slug)}</a></p>
    <button class="btn sec" id="up">Já respondeu? Ver resultado</button>
  </div>`;
  $('#wa').onclick=()=>track('convite_share',slug,{via:'wa'});

}

async function abrir(slug,papelHash){
  $('#app').innerHTML='<div class="card center"><p>Carregando…</p></div>';
  let d;try{d=await rpc('quiz_get',{p_slug:slug})}catch(e){d=undefined}
  if(d===undefined){$('#app').innerHTML='<div class="card center"><p>Sem conexão. Tente de novo.</p><button class="btn" onclick="route()">Tentar de novo</button></div>';return}
  if(!d){$('#app').innerHTML='<div class="card center"><p>Teste não encontrado. Confira o link.</p><a class="btn" href="./">Fazer um teste novo</a></div>';return}
  if(!d.respondido){
    const eu=meus()[slug];
    if(papelHash==='r'&&eu&&(eu.p||eu)==='a'&&!sessionStorage.getItem('sintonia_forca_'+slug)){souA(slug,d);return}
    if(papelHash==='r'){track('b_open',slug);introB(slug,d)}else convite(slug,d.nome_a,d.nome_b,false);
    return;
  }
  resultado(slug,d);
}

    <button class="btn sec" id="fc">Sou ${esc(d.nome_b)}, estamos no mesmo celular</button></div>`;

    <span class="tag">Teste de compatibilidade de casal</span>
    <h1>${esc(d.nome_a)} quer saber a sintonia de vocês 💘</h1>
    <p>São 20 perguntas rápidas sobre <b>você</b>. Você não vê as respostas de ${esc(d.nome_a)}, e vice-versa. No fim, os dois veem a % de sintonia.</p>
    <button class="btn" id="go">Responder agora (3 min)</button>
  </div>`;
  $('#go').onclick=()=>quiz(d.nome_a,d.nome_b,'b',slug);
}

function resultado(slug,d){
  $('#foot').classList.remove('hide');
  const p=pct(d.acertos),f=faixa(p);
  const pago=new URLSearchParams(location.search).get('pago');
  track('resultado_view',slug,{p});
  let rel='';
  if(d.unlocked){rel=relatorio(d);track('relatorio_view',slug)}
  else rel=`<div class="card noprint">
    <h2 style="margin-top:0">Relatório completo do casal</h2>
    ${teaser(d)}
    <ul class="clean"><li>Sintonia em cada área: rotina, dinheiro, lazer, futuro e carinho</li><li>As 20 respostas de vocês <b>lado a lado</b></li><li>Onde vocês divergem + <b>as conversas que valem ter</b></li><li>Pra guardar ou imprimir. Libera pros dois links.</li></ul>
    <button class="btn" id="pay">Ver relatório completo · ${PRECO}</button>
    <p class="mut center" style="margin:.5em 0 0">Pagamento único via Mercado Pago · Pix ou cartão</p>
  </div>`;
  $('#app').innerHTML=`<div class="card center">
    <div class="mut">${esc(d.nome_a)} ♥ ${esc(d.nome_b)}</div>
    <div class="big">${p}%</div>
    <h2 style="margin:.2em 0">${f[1]}</h2>
    <p>${f[2]}</p>
    <p class="mut">Vocês responderam igual em ${d.acertos} de 20 perguntas.</p>
    <button class="btn" id="st">Compartilhar nos Stories</button>
  </div>
  ${pago==='ok'&&!d.unlocked?'<div class="card center" id="aguarda"><p>Pagamento recebido! Liberando o relatório…</p></div>':''}
  ${pago==='pendente'&&!d.unlocked?'<div class="card center"><p>Pagamento pendente. Assim que o Mercado Pago aprovar (Pix costuma levar segundos), o relatório libera aqui neste link.</p></div>':''}
  ${rel}
  <div class="card center noprint"><p><b>Desafie outro casal</b> e vejam quem tem mais sintonia.</p><a class="btn sec" id="amg" href="${wa('Fizemos o teste de compatibilidade de casal e deu '+p+'% 💘 Duvido vocês baterem: '+SITE+'?src=amigos')}" target="_blank" rel="noopener">Mandar pra um casal amigo</a><a class="btn sec" href="./">Fazer um teste novo</a></div>`;
  $('#st').onclick=()=>stories(d,p,f,slug);
  $('#amg').onclick=()=>track('convite_share',slug,{via:'amigos'});
  if(!d.unlocked){$('#pay').onclick=()=>checkout(slug);track('paywall_view',slug)}
  else{const b=document.createElement('button');b.className='btn sec noprint';b.textContent='Imprimir / salvar em PDF';b.onclick=()=>print();$('#app').appendChild(b)}
  if(pago==='ok'&&!d.unlocked)poll(slug);
}

function teaser(d){
  const ar=d.areas||[];let top=0;ar.forEach((v,k)=>{if(v>ar[top])top=k});
  return `<p class="mut">Onde vocês mais combinam:</p><div class="area"><b><span>${AREAS[top]}</span><span>${ar[top]??'?'}%</span></b><div class="bar"><i style="width:${ar[top]||0}%"></i></div></div>
  <p class="mut" style="margin-top:14px">E as outras 4 áreas — incluindo onde vocês <b>mais divergem</b>:</p>
  <div class="blur" aria-hidden="true">${AREAS.filter((a,k)=>k!==top).map(a=>`<div class="area"><b><span>${a}</span><span>??%</span></b><div class="bar"><i style="width:50%"></i></div></div>`).join('')}</div>`;
}
function relatorio(d){
  const A=d.resp_a,B=d.resp_b;
  const areas=AREAS.map((n,k)=>{let c=0;for(let j=k*4;j<k*4+4;j++)if(A[j]===B[j])c++;return [n,c*25]});
  const fortes=areas.filter(a=>a[1]>=75).map(a=>a[0]);
  const div=[];for(let j=0;j<20;j++)if(A[j]!==B[j])div.push(j);
  return `<div class="card">
    <h2 style="margin-top:0">Sintonia por área</h2>
    ${areas.map(a=>`<div class="area"><b><span>${a[0]}</span><span>${a[1]}%</span></b><div class="bar"><i style="width:${a[1]}%"></i></div></div>`).join('')}
    ${fortes.length?`<p><b>Ponto forte do casal:</b> ${fortes.join(', ')}.</p>`:''}
  </div>
  <div class="card">
    <h2 style="margin-top:0">As conversas que valem ter</h2>
    ${div.length?`<p class="mut">Nas ${div.length} perguntas em que vocês responderam diferente, um bom ponto de partida:</p><ol>${div.map(j=>`<li style="margin:6px 0"><b>${AREAS[Math.floor(j/4)]}:</b> ${Q[j][2]}</li>`).join('')}</ol>`:'<p>Vocês responderam igual em tudo. Sério. Guardem esse print.</p>'}
  </div>
  <div class="card">
    <h2 style="margin-top:0">Respostas lado a lado</h2>
    ${Q.map((q,j)=>`<div><b>${j+1}. ${q[0]}</b>${A[j]===B[j]?' <span class="eq">✓ igual</span>':''}<div class="row"><div><span class="mut">${esc(d.nome_a)}</span><br>${q[1][A[j]]}</div><div><span class="mut">${esc(d.nome_b)}</span><br>${q[1][B[j]]}</div></div></div>`).join('')}
  </div>`;
}

async function checkout(slug){
  track('checkout_open',slug);const b=$('#pay');b.disabled=true;b.textContent='Abrindo pagamento…';
  try{const r=await fetch(SB_URL+'/functions/v1/mp-preferencia-sintonia',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({slug})});const j=await r.json();
    if(j.ok&&j.init_point){location.href=j.init_point;return}throw new Error(j.motivo)}
  catch(e){b.disabled=false;b.textContent='Ver relatório completo · '+PRECO;toast('Não consegui abrir o pagamento. Tente de novo.')}
}
async function poll(slug){for(let t=0;t<20;t++){await new Promise(r=>setTimeout(r,3000));try{const d=await rpc('quiz_get',{p_slug:slug});if(d&&d.unlocked){history.replaceState(null,'',location.pathname+'#c='+slug);resultado(slug,d);return}}catch(_){}}
  const a=$('#aguarda');if(a){a.innerHTML='<p>O Mercado Pago ainda está confirmando (pode levar alguns minutos). O relatório libera neste mesmo link.</p><button class="btn sec" id="vn">Verificar agora</button>';$('#vn').onclick=()=>poll(slug)}}

function stories(d,p,f,slug){
  track('stories_share',slug);
  const c=document.createElement('canvas');c.width=1080;c.height=1920;const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,1080,1920);g.addColorStop(0,'#e11d74');g.addColorStop(1,'#7c3aed');x.fillStyle=g;x.fillRect(0,0,1080,1920);
  x.fillStyle='#fff';x.textAlign='center';
  x.font='600 54px system-ui,sans-serif';x.fillText('Nossa sintonia de casal',540,520);
  const nomes=(d.nome_a+' ♥ '+d.nome_b);x.font='700 '+(nomes.length>22?58:76)+'px system-ui,sans-serif';x.fillText(nomes,540,640);
  x.font='900 300px system-ui,sans-serif';x.fillText(p+'%',540,1000);
  x.font='800 80px system-ui,sans-serif';x.fillText(f[1],540,1140);
  x.font='500 46px system-ui,sans-serif';x.fillText('E vocês? Façam o teste:',540,1560);
  x.font='700 50px system-ui,sans-serif';x.fillText('giogas-pm.github.io/sintonia',540,1640);
  c.toBlob(async b=>{const file=new File([b],'sintonia.png',{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],text:'Nossa sintonia: '+p+'% 💘 '+SITE+'?src=stories'});return}catch(_){}}
    const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='sintonia.png';a.click();toast('Imagem salva! Poste nos Stories.')},'image/png');
}

function route(){
  const h=new URLSearchParams(location.hash.slice(1));
  if(h.get('r'))return abrir(h.get('r'),'r');
  if(h.get('c'))return abrir(h.get('c'),'c');
  home();
}
window.addEventListener('hashchange',route);
route();
</script>
</body>
</html>
